        '<div class="small">去「商品」页点右下角添加吧</div></div></div>') +
      '<div class="buybar">' +
      '<button class="btn btn--ghost btn--sm" id="c-clear" type="button">清空</button>' +
      '<div class="buybar__mid" id="c-open"><div class="buybar__count" id="c-count">还没选商品</div>' +
      '<div class="buybar__total" id="c-total">¥0.00</div></div>' +
      '<button class="btn btn--primary" id="c-checkout" type="button" disabled>结算</button></div>';

    const search = document.getElementById("c-search");
    search.addEventListener("input", () => {
      local.search = search.value;
      const pos = search.selectionStart;
      viewCashier();
      const box = document.getElementById("c-search");
      box.focus(); box.setSelectionRange(pos, pos);
    });
    host.querySelectorAll("[data-cat]").forEach((b) =>
      b.addEventListener("click", () => { local.category = b.dataset.cat; viewCashier(); }));
    host.querySelectorAll("[data-add]").forEach((b) =>
      b.addEventListener("click", () => tapAdd(Number(b.dataset.add))));
    document.getElementById("c-clear").addEventListener("click", () => {
      Biz.clearCart(); renderCart(); viewCashier();
    });
    document.getElementById("c-open").addEventListener("click", () => {
      openSheet(el.cartSheet); renderCart();
    });
    document.getElementById("c-checkout").addEventListener("click", openCheckout);
    renderCart();
  }

  function tapAdd(productId) {
    const allowNeg = !!Biz.settings().allow_negative_stock;
    const stock = Biz.productStock(productId);
    const res = Biz.addToCart(productId, allowNeg ? null : stock);
    if (!res.ok) {
      const p = Biz.state().products.find((x) => x.id === productId);
      if (res.overflow) {
        confirm({
          title: "库存不够了",
          body: "<p><strong>" + M.esc(p.name) + "</strong> 系统里只剩 <strong>" +
                stock + "</strong> 件。</p><p class=\"small muted\">如果你确定实际还有货" +
                "（比如上架时数少了），可以选「按实际卖出」，这一单会照常记账，" +
                "库存会变成负数提醒你补数。</p>",
          confirmText: "按实际卖出", cancelText: "先不加", danger: true,
        }).then((yes) => {
          if (!yes) return;
          Biz.addToCartForce(productId);          // 摊主确认「实际还有货」，直接加上
          afterCartChange();
        });
      } else {
        toast(res.error || "加不进购物车", "error");
      }
      return;
    }
    afterCartChange();
  }

  function afterCartChange() {
    renderCart();
    const grid = document.querySelectorAll("[data-add]");
    if (grid.length) viewCashier();
    showStorageWarningIfNeeded();
  }

  function showStorageWarningIfNeeded() {
    const u = Store.usage();
    if (u.limit && u.bytes > u.limit * 0.85 && !showStorageWarningIfNeeded.warned) {
      showStorageWarningIfNeeded.warned = true;
      toast("手机存储快满了（" + Math.round(u.bytes / 1024) + "KB），建议去「更多」导出备份",
            "error");
    }
  }

  /* ---------------------------------------------------------- 购物车 */
  function renderCart() {
    const data = Biz.cartTotals();
    const q = data.quote;
    el.cartCount.textContent = data.count + " 件";

    const lines = Biz.cartLines();
    const cart = Biz.state().cart;
    if (!lines.length) {
      el.cartBody.innerHTML = '<div class="empty" style="padding:22px 8px">' +
        '<span class="empty__icon">🛒</span><div class="empty__title">还没选商品</div>' +
        '<div class="small">点商品图就能加一件</div></div>';
    } else {
      el.cartBody.innerHTML = lines.map((l) => {
        const item = cart.find((c) => c.product_id === l.product_id) || { qty: l.qty };
        return '<div class="cart-line"><div class="cart-line__main">' +
          '<div class="cart-line__name">' + M.esc(l.name) + "</div>" +
          '<div class="cart-line__sub mono">¥' + M.money(l.unit_price_cents) + " × " + l.qty +
          " = <strong>¥" + M.money(l.unit_price_cents * l.qty) + "</strong></div></div>" +
          '<div class="stepper">' +
          '<button type="button" data-minus="' + l.product_id + '">−</button>' +
          '<span class="stepper__num">' + item.qty + "</span>" +
          '<button type="button" data-plus="' + l.product_id + '">＋</button></div></div>';
      }).join("");
      el.cartBody.querySelectorAll("[data-minus]").forEach((b) =>
        b.addEventListener("click", () => {
          const id = Number(b.dataset.minus);
          const cur = (cart.find((c) => c.product_id === id) || {}).qty || 0;
          Biz.setCartQty(id, cur - 1);
          afterCartChange();
        }));
      el.cartBody.querySelectorAll("[data-plus]").forEach((b) =>
        b.addEventListener("click", () => tapAdd(Number(b.dataset.plus))));
    }

    if (q) {
      const rows = q.stages.filter((s) => s.key !== "final").map((s) => {
        const cut = s.amount_cents < 0;
        return '<div class="steps__row' + (cut ? " steps__row--cut" : "") + '">' +
          '<span class="steps__label">' + M.esc(s.label) + "</span>" +
          '<span class="steps__value">' + (cut ? "-" : "") + "¥" +
          M.money(Math.abs(s.amount_cents)) + "</span></div>";
      }).join("");
      el.cartSteps.innerHTML = '<div class="steps">' + rows +
        '<div class="steps__row steps__row--total"><span>应收</span>' +
        '<span class="steps__value">¥' + M.money(q.final_cents) + "</span></div></div>" +
        (q.discount_cents > 0 ? '<div class="saving">已省 ¥' + M.money(q.discount_cents) +
          "（相当于 " + M.esc(q.effective_rate) + "）</div>" : "");
    } else {
      el.cartSteps.innerHTML = "";
    }

    const enabled = data.count > 0;
    const btn = document.getElementById("btn-checkout");
    if (btn) {
      btn.disabled = !enabled;
      btn.textContent = enabled ? "结算 ¥" + (q ? M.money(q.final_cents) : "…") : "结算";
    }
    const mini = document.getElementById("c-checkout");
    if (mini) {
      mini.disabled = !enabled;
      mini.textContent = enabled ? "结算 ¥" + (q ? M.money(q.final_cents) : "…") : "结算";
    }
    const total = document.getElementById("c-total");
    if (total) total.textContent = "¥" + (q ? M.money(q.final_cents) : "0.00");
    const count = document.getElementById("c-count");
    if (count) count.textContent = data.count ? "共 " + data.count + " 件" : "还没选商品";

    renderDiscountBody();
  }

  /* ---------------------------------------------------------- 折扣设置 */
  function renderDiscountBody() {
    const cfg = Biz.discountConfig();
    const badge = el.discountBadge;
    const bits = [];
    if (cfg.percent_enabled) bits.push(cfg.percent_value + " 折");
    if (cfg.threshold_enabled && (cfg.tiers || []).length) bits.push("满减 " + cfg.tiers.length + " 档");
    if (bits.length) {
      badge.textContent = bits.join(" + ");
      badge.className = "badge badge--brand";
    } else {
      badge.className = "badge hidden";
    }

    const tiers = Pricing.normalizeTiers(cfg.tiers);
    el.discountBody.innerHTML =
      '<label class="switch"><input type="checkbox" id="d-percent"' +
        (cfg.percent_enabled ? " checked" : "") +
        '><span class="switch__track"></span><span>比例折扣</span></label>' +
      '<div class="row"><input class="input input--num" id="d-percent-val" type="number" ' +
        'step="0.1" min="0.1" max="10" value="' + cfg.percent_value + '" style="max-width:100px">' +
        '<span class="muted small">折（10 = 不打折）</span></div>' +
      '<hr class="sep">' +
      '<label class="switch"><input type="checkbox" id="d-threshold"' +
        (cfg.threshold_enabled ? " checked" : "") +
        '><span class="switch__track"></span><span>满减</span></label>' +
      '<div id="d-tiers">' + (tiers.length ? tiers.map((t) =>
        '<div class="tier-row" style="margin-bottom:6px">' +
        '<span class="small muted nowrap">满</span>' +
        '<input class="input input--num" data-th="' + t.threshold_cents + '" type="number" ' +
        'min="0" step="1" value="' + (t.threshold_cents / 100).toFixed(2) + '">' +
        '<span class="small muted nowrap">减</span>' +
        '<input class="input input--num" data-cut="' + t.cut_cents + '" type="number" ' +
        'min="0" step="0.5" value="' + (t.cut_cents / 100).toFixed(2) + '">' +
        '<button class="btn btn--ghost btn--xs" type="button" data-del-tier="' +
        t.threshold_cents + '">✕</button></div>').join("")
        : '<div class="small faint">还没有档位，点下面加一档</div>') + "</div>" +
      '<button class="btn btn--sm" id="d-add-tier" type="button">＋ 加一档</button>' +
      '<hr class="sep">' +
      '<label class="field" style="margin:0"><span class="field__label">尾数取整</span>' +
      '<select class="select" id="d-round">' + Object.keys(M.ROUNDING).map((k) =>
        '<option value="' + k + '"' + (cfg.rounding_mode === k ? " selected" : "") + ">" +
        M.ROUNDING[k] + "</option>").join("") + "</select></label>" +
      ((cfg.percent_enabled && cfg.threshold_enabled)
        ? '<div class="notice notice--warn">比例折扣和满减会叠加（先打折再满减），' +
          "力度较大，结算前会再次确认。</div>" : "");

    const pct = document.getElementById("d-percent");
    pct.addEventListener("change", () => {
      let v = parseFloat(document.getElementById("d-percent-val").value);
      if (!isFinite(v) || v <= 0 || v >= 10) v = 9;
      Biz.setDiscount({ percent_enabled: pct.checked, percent_value: v });
      renderCart();
    });
    document.getElementById("d-percent-val").addEventListener("change", (e) => {
      let v = parseFloat(e.target.value);
      if (!isFinite(v) || v <= 0) v = 0.1;
      if (v > 10) v = 10;
      Biz.setDiscount({ percent_value: v });
      renderCart();
    });
    document.getElementById("d-threshold").addEventListener("change", (e) => {
      let list = Pricing.normalizeTiers(Biz.discountConfig().tiers);
      if (e.target.checked && !list.length) list = [{ threshold_cents: 10000, cut_cents: 1000 }];
      Biz.setDiscount({ threshold_enabled: e.target.checked, tiers: list });
      renderCart();
    });
    document.getElementById("d-add-tier").addEventListener("click", () => {
      const list = Pricing.normalizeTiers(Biz.discountConfig().tiers);
      const last = list[list.length - 1];
      list.push({
        threshold_cents: last ? last.threshold_cents + 10000 : 10000,
        cut_cents: last ? last.cut_cents + 1000 : 1000,
      });
      Biz.setDiscount({ tiers: list });
      renderCart();
    });
    el.discountBody.querySelectorAll("[data-del-tier]").forEach((b) =>
      b.addEventListener("click", () => {
        const target = Number(b.dataset.delTier);
        Biz.setDiscount({
          tiers: Pricing.normalizeTiers(Biz.discountConfig().tiers)
            .filter((t) => t.threshold_cents !== target),
        });
        renderCart();
      }));
    el.discountBody.querySelectorAll("[data-th]").forEach((input) =>
      input.addEventListener("change", () => {
        const oldTh = Number(input.dataset.th);
        const newTh = M.toCents(input.value) || 0;
        const list = Pricing.normalizeTiers(Biz.discountConfig().tiers).map((t) =>
          t.threshold_cents === oldTh ? { threshold_cents: newTh, cut_cents: t.cut_cents } : t);
        Biz.setDiscount({ tiers: list });
        renderCart();
      }));
    el.discountBody.querySelectorAll("[data-cut]").forEach((input) =>
      input.addEventListener("change", () => {
        const oldCut = Number(input.dataset.cut);
        const newCut = M.toCents(input.value) || 0;
        const list = Pricing.normalizeTiers(Biz.discountConfig().tiers).map((t) =>
          t.cut_cents === oldCut ? { threshold_cents: t.threshold_cents, cut_cents: newCut } : t);
        Biz.setDiscount({ tiers: list });
        renderCart();
      }));
    document.getElementById("d-round").addEventListener("change", (e) => {
      Biz.setDiscount({ rounding_mode: e.target.value });
      renderCart();
    });
  }

  /* ---------------------------------------------------------- 结算 */
  function openCheckout() {
    const data = Biz.cartTotals();
    if (!data.quote) { toast("先选点商品吧", "error"); return; }
    const q = data.quote;
    const box = document.createElement("div");
    box.innerHTML =
      (q.stacked ? '<div class="notice notice--warn" style="margin-bottom:11px">' +
        "比例折扣和满减<b>叠加</b>生效中，确认一下金额没问题再收钱。</div>" : "") +
      '<div class="steps">' + q.stages.filter((s) => s.key !== "final").map((s) =>
        '<div class="steps__row' + (s.amount_cents < 0 ? " steps__row--cut" : "") + '">' +
        '<span class="steps__label">' + M.esc(s.label) + "</span>" +
        '<span class="steps__value">' + (s.amount_cents < 0 ? "-" : "") + "¥" +
        M.money(Math.abs(s.amount_cents)) + "</span></div>").join("") +
      '<div class="steps__row steps__row--total"><span>应收</span><span class="steps__value">¥' +
      M.money(q.final_cents) + "</span></div></div>" +
      '<div class="field mt-16"><span class="field__label">客人付了多少（可选，填了自动算找零）</span>' +
      '<input class="input input--num" id="pay-in" type="number" inputmode="decimal" min="0" ' +
      'step="0.01" placeholder="留空表示正好收齐"></div>' +
      '<div class="row" id="quick-pay" style="margin-bottom:9px"></div>' +
      '<div class="notice notice--brand hidden" id="change-box"></div>' +
      '<label class="field mt-16"><span class="field__label">备注（可选）</span>' +
      '<input class="input" id="note-in" maxlength="60" placeholder="比如：老客人预留"></label>';

    const handle = modal({ title: "确认这一单", body: box, footer: "" });
    const payIn = box.querySelector("#pay-in");
    const changeBox = box.querySelector("#change-box");
    const quick = box.querySelector("#quick-pay");

    const values = [];
    [q.final_cents, 5000, 10000, 20000, 50000].forEach((c) => {
      if (c >= q.final_cents && values.indexOf(c) < 0) values.push(c);
    });
    values.slice(0, 4).forEach((c) => {
      const b = document.createElement("button");
      b.className = "btn btn--sm"; b.type = "button"; b.textContent = "¥" + M.money(c);
      b.addEventListener("click", () => { payIn.value = (c / 100).toFixed(2); updateChange(); });
      quick.appendChild(b);
    });

    function updateChange() {
      const paid = M.toCents(payIn.value);
      if (paid == null || payIn.value.trim() === "") { changeBox.classList.add("hidden"); return; }
      const diff = paid - q.final_cents;
      changeBox.classList.remove("hidden");
      if (diff < 0) {
        changeBox.className = "notice notice--danger";
        changeBox.textContent = "还差 ¥" + M.money(-diff) + "，实付金额不足";
      } else {
        changeBox.className = "notice notice--brand";
        changeBox.textContent = "应找零 ¥" + M.money(diff);
      }
    }
    payIn.addEventListener("input", updateChange);

    handle.footer.innerHTML = "";
    const cancel = document.createElement("button");
    cancel.className = "btn"; cancel.type = "button"; cancel.textContent = "再看看";
    const submit = document.createElement("button");
    submit.className = "btn btn--primary"; submit.type = "button"; submit.textContent = "完成交易";
    submit.style.flex = "2";
    cancel.addEventListener("click", () => handle.close());
    submit.addEventListener("click", () => {
      const paidText = payIn.value.trim();
      const paid = paidText === "" ? null : M.toCents(payIn.value);
      if (paidText !== "" && paid == null) { toast("客人付的金额填得不对", "error"); return; }
      const res = Biz.commitTransaction({
        paidCents: paid,
        note: box.querySelector("#note-in").value.trim() || null,
        confirmDiscount: q.stacked,
        allowNegative: true,
      });
      if (!res.ok) { toast(res.error, "error"); return; }
      handle.close();
      closeSheets();
      afterCartChange();
      showReceipt(res.transaction);
    });
    handle.footer.appendChild(cancel);
    handle.footer.appendChild(submit);
  }

  /* ---------------------------------------------------------- 回执 */
  function showReceipt(tx) {
    const voided = tx.status === "voided";
    const box = document.createElement("div");
    box.innerHTML =
      '<div class="receipt__hero' + (voided ? " is-voided" : "") + '">' +
      '<div class="receipt__label">' + (voided ? "这笔已撤销" : "实收") + "</div>" +
      '<div class="receipt__amount">¥' + M.money(tx.final_cents) + "</div>" +
      (tx.discount_cents > 0 ? '<div class="receipt__saving">原价 ¥' + M.money(tx.gross_cents) +
        "，已省 ¥" + M.money(tx.discount_cents) + "（" + M.esc(M.rate(tx.gross_cents, tx.final_cents)) +
        "）</div>" : "") + "</div>" +
      '<div class="row row--between small faint"><span>单号 #' + tx.id + "</span><span>" +
      M.esc(tx.created_at) + "</span></div>" +
      '<div class="steps mt-10">' + (tx.items || []).map((i) =>
        '<div class="steps__row"><span class="steps__label">' + M.esc(i.name) + " × " + i.qty +
        '</span><span class="steps__value">¥' + M.money(i.unit_price_cents * i.qty) +
        "</span></div>").join("") +
      (tx.paid_cents != null ? '<div class="steps__row mt-10"><span class="steps__label">客人付' +
        '</span><span class="steps__value">¥' + M.money(tx.paid_cents) + "</span></div>" +
        '<div class="steps__row"><span class="steps__label">找零</span><span class="steps__value">¥' +
        M.money(tx.change_cents || 0) + "</span></div>" : "") + "</div>" +
      (tx.note ? '<div class="notice notice--brand mt-10">备注：' + M.esc(tx.note) + "</div>" : "");

    const handle = modal({ title: voided ? "撤销回执" : "记好了", body: box, footer: "" });
    handle.footer.innerHTML = "";
    const undo = document.createElement("button");
    undo.className = "btn"; undo.type = "button"; undo.textContent = "撤销这一单";
    undo.disabled = voided;
    const next = document.createElement("button");
    next.className = "btn btn--primary"; next.type = "button"; next.textContent = "继续点下一单";
    next.style.flex = "1.4";
    undo.addEventListener("click", () => { handle.close(); askVoid(tx.id); });
    next.addEventListener("click", () => handle.close());
    handle.footer.appendChild(undo);
    handle.footer.appendChild(next);
  }

  async function askVoid(txId) {
    const tx = Biz.state().transactions.find((t) => t.id === txId);
    const yes = await confirm({
      title: "撤销 #" + txId + " 这笔？",
      body: "<p>" + M.esc(Biz.txQuickText(tx)) + "</p>" +
            '<p class="small muted">撤销后这一单不计入销售额，卖掉的商品会加回库存，' +
            "单据本身留档，随时查得到。</p>",
      confirmText: "确认撤销", danger: true,
    });
    if (!yes) return;
    const res = Biz.voidTransaction(txId, "摊主在收银台撤销");
    if (!res.ok) { toast(res.error, "error"); return; }
    toast("已撤销，库存也加回去了", "ok");
    render();
  }

  function editProduct(product) {

      '<label class="field"><span class="field__label">库存预警线</span>' +

      '<select class="select" id="p-kind">' +
      '<option value="none">不单独优惠</option>' +
      '<option value="second_half">第二件半价</option>' +
      '<option value="nth_percent">第 N 件 X 折</option></select>' +
      '<div class="row mt-6">' +
      '<span class="row hidden" id="p-nth-wrap" style="gap:6px"><span class="small muted">第</span>' +

      toast(editing ? "改好了" : "商品已添加", "ok");
      viewGoods();
    });

    handle.footer.appendChild(save);

    if (editing) {
      const del = document.createElement("button");
      del.className = "btn btn--danger"; del.type = "button"; del.textContent = "删除";
      del.addEventListener("click", async () => {
        const yes = await confirm({
          title: "确定删除？",
          body: "<p>要删除 <strong>" + M.esc(product.name) + "</strong> 吗？</p>" +
                '<p class="small muted">历史单据会保留（商品名和单价有快照），但库存流水会被清掉。' +
                "只是这场不卖了，建议改成「下架」。</p>",
          confirmText: "删除", danger: true,
        });

        Biz.deleteProduct(product.id);

        toast("已删除", "ok");

  function askRestock(product) {
    const stock = Biz.productStock(product.id);
    const box = document.createElement("div");
    box.innerHTML = "<p><strong>" + M.esc(product.name) + "</strong> 现在剩 <strong>" + stock +
      "</strong> 件。</p>" +
      '<label class="field mt-16"><span class="field__label">补多少件？（盘点发现少了就填负数）' +
      '</span><input class="input input--num" id="r-qty" type="number" step="1" value="10"></label>' +
      '<div class="notice notice--brand" id="r-hint">变动后剩余：' + (stock + 10) + " 件</div>";
    const handle = modal({ title: "补货 / 盘点", body: box, footer: "" });
    const input = box.querySelector("#r-qty");
    const hint = box.querySelector("#r-hint");
    input.addEventListener("input", () => {
      const n = parseInt(input.value, 10);
      hint.textContent = isFinite(n) ? "变动后剩余：" + (stock + n) + " 件" : "填个整数吧";
    });
    handle.footer.innerHTML = "";
    const cancel = document.createElement("button");
    cancel.className = "btn"; cancel.type = "button"; cancel.textContent = "取消";
    const save = document.createElement("button");
    save.className = "btn btn--primary"; save.type = "button"; save.textContent = "确认";
    save.style.flex = "1.5";
    cancel.addEventListener("click", () => handle.close());
    save.addEventListener("click", () => {
      const res = Biz.restock(product.id, input.value);
      if (!res.ok) { toast(res.error, "error"); return; }
      handle.close();
      toast("库存已更新", "ok");
      viewStock();
    });
    handle.footer.appendChild(cancel);
    handle.footer.appendChild(save);
  }

        const mode = await confirm({
          title: "怎么导入？",
          body: "<p>请选择处理方式：</p>" +
                "<p><strong>替换</strong>：手机上的现有数据全部换成文件里的（推荐第一次从电脑搬过来时用）。<br>" +

          confirmText: "替换（清空现有的）", cancelText: "合并进来", danger: true,
        });
        const res = Biz.importArchive(reader.result, mode ? "replace" : "merge");
        fileInput.value = "";
        if (!res.ok) { toast(res.error, "error"); return; }
        toast("导入好了：商品 " + res.counts.products + " 款，单据 " + res.counts.transactions + " 笔",

    });

      const yes = await confirm({
        title: "清空所有数据？",
        body: "<p>商品、单据、库存流水、场次全部会消失，<strong>无法恢复</strong>。</p>" +
              '<p class="small muted">如果里面有真实账目，请先「导出备份」。</p>',
        confirmText: "确认清空", danger: true,
      });
      if (!yes) return;
      Biz.resetAll();
      Biz.ensureSession();
      toast("已清空", "ok");
      render();
    });
  }

      '<span class="small muted nowrap">件，只收</span>' +
      '<input class="input input--num" data-bp="' + i + '" type="number" min="0" step="0.5" ' +
      'value="' + (b.price_cents / 100).toFixed(2) + '" style="max-width:95px">' +
      '<span class="small muted nowrap">元</span></div>' +
      '<div class="bundle-chips">' + products.map((p) =>
        '<label class="bundle-chip"><input type="checkbox" data-bc="' + i + '" value="' + p.id + '"' +
        (b.product_ids.indexOf(p.id) >= 0 ? " checked" : "") + "><span>" + M.esc(p.name) +
        ' <span class="faint">¥' + p.price_display + "</span></span></label>").join("") +
      "</div></div>").join("");

    function patch(i, fn) {
      const rules = (Biz.settings().bundle_rules || []).map((x) => Object.assign({}, x));
      if (!rules[i]) return;
      fn(rules[i]);
      Biz.saveSettings({ bundle_rules: rules });
    }
    host.querySelectorAll("[data-bn]").forEach((el2) =>
      el2.addEventListener("change", () => patch(Number(el2.dataset.bn), (r) => { r.name = el2.value; })));
    host.querySelectorAll("[data-bq]").forEach((el2) =>
      el2.addEventListener("change", () => patch(Number(el2.dataset.bq),
        (r) => { r.qty = Math.max(2, parseInt(el2.value, 10) || 2); })));
    host.querySelectorAll("[data-bp]").forEach((el2) =>
      el2.addEventListener("change", () => patch(Number(el2.dataset.bp),
        (r) => { r.price_cents = M.toCents(el2.value) || 0; })));
    host.querySelectorAll("[data-bc]").forEach((el2) =>
      el2.addEventListener("change", () => {
        const i = Number(el2.dataset.bc);
        const checked = Array.prototype.filter.call(
          host.querySelectorAll('[data-bc="' + i + '"]'), (x) => x.checked).map((x) => Number(x.value));
        patch(i, (r) => { r.product_ids = checked; });
      }));
    host.querySelectorAll("[data-bd]").forEach((el2) =>
      el2.addEventListener("click", () => {
        const list2 = (Biz.settings().bundle_rules || []).filter((x, idx) =>
          idx !== Number(el2.dataset.bd));
        Biz.saveSettings({ bundle_rules: list2 });
        renderBundles();
      }));
  }

  async function askNewSession() {
    const active = Biz.activeSession();
    const box = document.createElement("div");
    const d = new Date();
    const suggestion = (d.getMonth() + 1) + "月" + d.getDate() + "日 出摊";
    box.innerHTML =
      (active ? '<div class="notice notice--warn">现在「' + M.esc(active.name) +
        "」正在进行，开新一场会先把它收尾（已记的单子不会丢，只是以后统计归到这一场名下）。</div>"
        : "") +
      '<label class="field mt-16"><span class="field__label">这一场叫什么？</span>' +
      '<input class="input" id="ns-name" maxlength="40" value="' + M.esc(suggestion) + '"></label>' +
      '<label class="field"><span class="field__label">备注（可选）</span>' +
      '<input class="input" id="ns-note" maxlength="60" placeholder="比如：某高校夏季场"></label>';
    const handle = modal({ title: "开新一场", body: box, footer: "" });
    handle.footer.innerHTML = "";
    const cancel = document.createElement("button");
    cancel.className = "btn"; cancel.type = "button"; cancel.textContent = "取消";
    const save = document.createElement("button");
    save.className = "btn btn--primary"; save.type = "button"; save.textContent = "开始这一场";
    save.style.flex = "1.5";
    cancel.addEventListener("click", () => handle.close());
    save.addEventListener("click", () => {
      const res = Biz.startSession(box.querySelector("#ns-name").value,
                                   box.querySelector("#ns-note").value);
      if (!res.ok) { toast(res.error, "error"); return; }
      handle.close();
      toast("新的一场开始了", "ok");
      render();
    });
    handle.footer.appendChild(cancel);
    handle.footer.appendChild(save);
  }

  async function askCloseSession(session) {
    const yes = await confirm({
      title: "「" + session.name + "」收摊？",
      body: "<p>收摊后这一场就结束了，结算表会固定下来作为这一场的最终结果。</p>" +
            '<p class="small muted">之后新卖出的东西会记到下一场（如果还没开新场，会自动开一场新的）。' +
            "已经记好的单子不受影响。</p>",
      confirmText: "确认收摊",
    });
    if (!yes) return;
    const res = Biz.closeSession(session.id);
    if (!res.ok) { toast(res.error, "error"); return; }
    toast("这一场已收摊", "ok");
    render();
  }

  /* ---------------------------------------------------------- 场次抽屉 */
  function openSessionSheet() {
    const sessions = Biz.listSessions();
    const active = Biz.activeSession();
    el.sessionBody.innerHTML =
      '<div class="notice ' + (active ? "notice--brand" : "notice--warn") + '">' +
      (active ? "当前正在进行：<strong>" + M.esc(active.name) + "</strong>，新单子都会记到这一场。"
              : "现在没有进行中的场次，下一个单子会自动开一场。") + "</div>" +
      '<button class="btn btn--primary btn--block mt-10" id="ss-new" type="button">＋ 开新一场</button>' +
      (active ? '<button class="btn btn--block mt-6" id="ss-close" type="button">收摊（结束这一场）' +
        "</button>" : "") +
      '<div class="section">历史场次</div>' +
      (sessions.length ? '<div class="list">' + sessions.map((x) => {
        const sum = Biz.sessionSummary(x.id);
        return '<div class="item"><div class="item__main"><div class="item__title">' + M.esc(x.name) +
          (x.is_active ? ' <span class="badge badge--brand">进行中</span>' : "") + "</div>" +
          '<div class="item__sub">' + sum.orders + " 单 · 售出 " + sum.total_sold +
          " 件 · " + M.esc(x.started_at.slice(0, 16)) + "</div></div>" +
          '<div class="item__amount">¥' + sum.revenue_display + "</div></div>";
      }).join("") + "</div>" : '<div class="small faint">还没有场次</div>');

    document.getElementById("ss-new").addEventListener("click", () => {
      closeSheets(); askNewSession();
    });
    const close = document.getElementById("ss-close");
    if (close) close.addEventListener("click", () => { closeSheets(); askCloseSession(active); });
    openSheet(el.sessionSheet);
  }

  /* ---------------------------------------------------------- 启动 */
  function boot() {
    document.getElementById("hdr-session").addEventListener("click", openSessionSheet);
    renderNav();
    // 启动即自检存储：若无法写入，必须立刻提示，避免用户记录整场后才发现在做无用功
    const check = Store.selfCheck();
    Biz.ensureSession();
    Biz.touch();
    go("cashier");
    if (!check.ok) {
      setTimeout(() => {
        modal({
          title: "⚠ 这台手机上存不住数据",
          body: "<p>本地存储写入测试未通过。</p>" +
                '<p class="small muted">原因：' + M.esc(check.reason) + "。<br>" +
                "常见于「用浏览器直接打开本地 HTML 文件」，有些浏览器不允许这样存数据。</p>" +
                '<p><b>现在开始记的账，一关页面就会消失。</b></p>' +
                "<p>两个办法：<br>" +
                "① 按手机安装说明里的「方法一」重新打开（数据就能存住）；<br>" +
                "② 先临时用着，但离开前务必去「更多 → 导出备份」，下次再导入。</p>",
        });
      }, 400);
    } else {
      showStorageWarningIfNeeded();
    }
  }

  return { boot, go, toast, render, renderCart, viewGoods, viewStock, viewStats, viewMore,
           viewCashier, openSessionSheet, modal, confirm,
           // 以下均为 ?demo= 界面自检入口使用
           editProductForDemo: () => editProduct(null),
           checkoutForDemo: () => {
             // 空购物车无法打开结算弹窗，先自动加入两件商品
             if (!Biz.cartLines().length) {
               Biz.listProducts(true).slice(0, 2).forEach((p) => {
                 Biz.addToCartForce(p.id);
                 Biz.addToCartForce(p.id);
               });
               render();
             }
             openCheckout();
           },
           receiptForDemo: () => {
             const target = Biz.listProducts(true)[0];
             if (target) { Biz.addToCartForce(target.id); Biz.commitTransaction({}); }
             const tx = Biz.listTransactions(1)[0];
             if (tx) showReceipt(tx);
           },
           sessionSheetForDemo: openSessionSheet };
})();

document.addEventListener("DOMContentLoaded", function () { UI.boot(); });

/* 界面自检入口：仅当 URL 带 ?demo=xxx 时生效，不影响正常打开。
   作用是在桌面浏览器中直接调出指定弹窗，便于截图核对布局——
   仅阅读代码无法判断「按钮是否真的在可视区域内」。 */
(function () {
  const params = new URLSearchParams(location.search);
  const demo = params.get("demo");
  if (!demo) return;

  /* ?demo=seed 预先写入示例商品，便于观察真实布局 */
  if (demo === "seed" || demo.indexOf("seed-") === 0) {
    const existing = Biz.listProducts(false);
    if (!existing.length) {
      [["色纸 A3 特典", "色纸", 5000, 40], ["亚克力钥匙扣", "挂件", 2500, 60],
       ["吧唧徽章 58mm", "吧唧", 1500, 100], ["镭射票根", "票根", 1000, 80],
       ["无料贴纸包", "贴纸", 800, 120]].forEach(function (row) {
        Biz.saveProduct({ name: row[0], category: row[1], price_cents: row[2],
                          stock_initial: row[3], low_stock_alert: 5 });
      });
    }
    if (demo === "seed") return;      // 只灌数据，不弹窗
  }

  window.addEventListener("load", function () {
    setTimeout(function () {
      try {
        if (demo === "product" || demo === "seed-product") UI.editProductForDemo();
        else if (demo === "checkout" || demo === "seed-checkout") UI.checkoutForDemo();
        else if (demo === "receipt" || demo === "seed-receipt") UI.receiptForDemo();
        else if (demo === "session") UI.sessionSheetForDemo();
      } catch (e) {
        document.title = "自检失败：" + (e && e.message);
        document.body.style.background = "#fdd";
      }
    }, 150);
  });
})();

/* 给自动化测试用：把内部模块挂到全局，方便脱离浏览器直接验证业务逻辑。
   浏览器里只是多挂几个引用，不影响任何行为。 */
if (typeof globalThis !== "undefined") {
  globalThis.__stallcalc = {
    M: M, Pricing: Pricing, Store: Store, Biz: Biz, Images: Images, UI: UI,
  };
}
</script>
